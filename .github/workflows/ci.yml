name: TradePilot CI

on:
  push:
    branches: [main, 'feat/**', 'phase-2-**']
  pull_request:
    branches: [main, 'feat/**', 'phase-2-**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall app main.py
      - name: Validate database migrations
        env:
          TRADEPILOT_DATABASE_URL: sqlite:///./ci_migration.db
          TRADEPILOT_AUTO_CREATE_SCHEMA: "false"
        run: alembic upgrade head
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder-password
          TRADEPILOT_JWT_SECRET: ci-placeholder-jwt-secret
          TRADEPILOT_BROKER_ENCRYPTION_KEY: ci-placeholder-broker-key
          TRADEPILOT_CORS_ORIGINS: http://localhost:5173
          VITE_API_URL: http://localhost:8000/api/v1
        run: docker compose config --quiet
