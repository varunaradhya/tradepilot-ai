name: TradePilot CI

on:
  push:
    branches: [main, 'feat/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradepilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall app main.py
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder-password
          TRADEPILOT_JWT_SECRET: ci-placeholder-jwt-secret
          TRADEPILOT_BROKER_ENCRYPTION_KEY: ci-placeholder-broker-key
        run: docker compose config --quiet

  release-gate:
    if: always()
    needs: [backend, frontend, deployment-config]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce release gate
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-config.result }}
        run: |
          echo "backend=${BACKEND_RESULT}"
          echo "frontend=${FRONTEND_RESULT}"
          echo "deployment-config=${DEPLOYMENT_RESULT}"
          test "${BACKEND_RESULT}" = "success"
          test "${FRONTEND_RESULT}" = "success"
          test "${DEPLOYMENT_RESULT}" = "success"
